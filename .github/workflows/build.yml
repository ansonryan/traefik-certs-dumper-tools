name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "0 4 * * 1"      # 每周一探一次上游
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name and upstream tag
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          # 上游版本只存在于 Dockerfile 的 FROM 行，避免两处不同步
          UPSTREAM="$(grep -oP 'traefik-certs-dumper:\K[^[:space:]]+' Dockerfile | head -1)"
          echo "UPSTREAM=$UPSTREAM" >> "$GITHUB_ENV"
          echo "building on upstream $UPSTREAM"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.UPSTREAM }}-tools
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # 需要 arm64 就改成 linux/amd64,linux/arm64
          platforms: linux/amd64
